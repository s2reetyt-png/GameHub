<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #050509;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .launcher {
            text-align: center;
        }

        .logo {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 7px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            letter-spacing: 4px;
            margin-bottom: 40px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 18px 55px;

            background: white;
            color: black;

            font-size: 18px;
            font-weight: 800;

            cursor: pointer;

            transition:
                transform .2s,
                box-shadow .2s;
        }

        button:hover {
            transform: scale(1.06);
            box-shadow: 0 0 40px rgba(255,255,255,.3);
        }

        .error {
            display: none;
            margin-top: 25px;
            color: #ff5555;
        }
    </style>
</head>

<body>

<div class="launcher">

    <div class="logo">
        GAMEHUB
    </div>

    <div class="subtitle">
        GAMING ENVIRONMENT
    </div>

    <button id="launchButton">
        LAUNCH GAMEHUB
    </button>

    <div class="error" id="error">
        Popup blocked. Please allow popups for GameHub.
    </div>

</div>

<script>

const launchButton =
    document.getElementById("launchButton");

const error =
    document.getElementById("error");


launchButton.addEventListener("click", async () => {

    error.style.display = "none";

    /*
        IMPORTANT:

        This MUST happen directly inside
        the click event.

        The browser initially creates
        an actual about:blank window.
    */

    const gameWindow = window.open(
        "",
        "GAMEHUB_ABOUT_BLANK"
    );

    if (!gameWindow) {

        error.style.display = "block";

        return;
    }

    /*
        Get the actual GameHub HTML.
    */

    try {

        const response =
            await fetch("/Schoolgames.html");

        if (!response.ok) {
            throw new Error(
                "Could not load GameHub."
            );
        }

        const html =
            await response.text();

        /*
            Write the GameHub page directly
            into the about:blank document.

            We DO NOT navigate the window.

            Therefore its address remains:

            about:blank
        */

        gameWindow.document.open();

        gameWindow.document.write(html);

        gameWindow.document.close();

        /*
            Focus the GameHub window.
        */

        gameWindow.focus();

    } catch (err) {

        console.error(err);

        gameWindow.document.body.innerHTML = `
            <div style="
                background:#050509;
                color:white;
                font-family:Arial;
                height:100vh;
                display:flex;
                align-items:center;
                justify-content:center;
                text-align:center;
            ">
                <div>
                    <h1>GAMEHUB ERROR</h1>
                    <p>Could not load GameHub.</p>
                </div>
            </div>
        `;

    }

});

</script>

</body>
</html>
